
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Burundi Transport</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f5f9;
            color: #1e2a36;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #2c6e9b;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 23px;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            color: #5f7080;
            text-align: center;
            line-height: 1.6;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5df;
            border-radius: 7px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: 2px solid #4a8db8;
            border-color: #2c6e9b;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2c6e9b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e4d6f;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2c6e9b;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="reset-card">
        <div class="logo">Burundi Transport</div>

        <h1>Mot de passe oublié ?</h1>

        <p class="description">
            Saisissez l'adresse e-mail associée à votre compte.
            Si elle correspond à un compte, vous recevrez les instructions
            de réinitialisation.
        </p>

        <form id="resetForm">
            <label for="email">Adresse e-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="exemple@email.com"
                autocomplete="email"
                maxlength="150"
                required
            >

            <button type="submit" id="submitButton">
                Envoyer le lien
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <a href="login.html" class="back-link">
            Retour à la connexion
        </a>
    </main>

    <script src="mot-de-passe-oublie.js"></script>
</body>
</html>
